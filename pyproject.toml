[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lobby-attendance"
version = "0.1.0"
description = "Local-first lobby recognition-event foundation"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.0",
  "cryptography==50.0.0",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless==4.10.0.84",
]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
